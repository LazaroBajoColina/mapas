  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      margin: 0;
      padding: 40px 15px;

      font-size: 14px;
      margin-bottom: 25px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s, transform 0.1s;
    }
    a.btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    a.btn span {
      margin-right: 12px;
      font-size: 20px;
